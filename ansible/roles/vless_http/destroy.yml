---
# Tear down the vless-http wrapper on the chain entry host.
# Entry: scripts/destroy_chain.py runs this before the AWG teardown.

- name: Destroy vless-http wrapper on wrapper host
  hosts: "{{ vless_wrapper_host }}"
  become: true
  gather_facts: false
  vars:
    awg_chain_name: "{{ awg_chain_name | mandatory }}"
  vars_files:
    - ../common/defaults/main.yml
    - defaults/main.yml
    - "{{ awg_work_chain_generated }}"
  tasks:
    - name: Import wrapper host teardown
      ansible.builtin.import_tasks: "{{ awg_roles_vless_http_tasks }}/destroy_host.yml"
