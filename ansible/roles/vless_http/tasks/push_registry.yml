---
- name: vless-http config directory
  ansible.builtin.file:
    path: "{{ vless_http_dir }}"
    state: directory
    mode: "0755"

- name: Push vless_clients registry to wrapper host
  ansible.builtin.copy:
    src: "{{ awg_work_group_vars }}/vless_clients.yml"
    dest: "{{ vless_http_vless_clients }}"
    mode: "0600"

- name: Persist rendered config.json on wrapper host
  ansible.builtin.copy:
    src: "{{ awg_work_vless_http_configs }}/{{ inventory_hostname }}.json"
    dest: "{{ vless_http_config_path }}"
    mode: "0644"
