---
- name: Node artifacts directory in temporary work area
  ansible.builtin.file:
    path: "{{ awg_work_artifacts }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  vars:
    ansible_become: false

- name: Fetch AWG node private key into temporary work area
  ansible.builtin.fetch:
    src: "{{ awg_remote_host_keys_dir }}/private.key"
    dest: "{{ awg_work_artifacts }}/{{ inventory_hostname }}/private.key"
    flat: true
  no_log: true

- name: Fetch AWG node public key into temporary work area
  ansible.builtin.fetch:
    src: "{{ awg_remote_host_keys_dir }}/public.key"
    dest: "{{ awg_work_artifacts }}/{{ inventory_hostname }}/public.key"
    flat: true
