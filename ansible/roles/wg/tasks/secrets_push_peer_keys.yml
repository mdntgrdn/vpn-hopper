---
- name: Peers directory on node
  ansible.builtin.file:
    path: "{{ awg_remote_peers_dir }}"
    state: directory
    mode: "0700"

- name: Deploy neighbor public keys to peers/
  ansible.builtin.copy:
    dest: "{{ awg_remote_peers_dir }}/{{ item.peer }}_public.key"
    mode: "0644"
    content: "{{ item.public_key }}\n"
  loop: "{{ awg_peer_public_keys_for_host | default([]) }}"
  when: awg_peer_public_keys_for_host | default([]) | length > 0
  no_log: true
