---
- name: Check node SSH reachability
  ansible.builtin.ping:

- name: Node parameters summary
  ansible.builtin.debug:
    msg:
      - "inventory_hostname={{ inventory_hostname }}"
      - "ansible_host={{ ansible_host | default(inventory_hostname) }}"
      - "distro={{ ansible_facts['distribution'] | default('n/a') }} {{ ansible_facts['distribution_version'] | default('') }}"
