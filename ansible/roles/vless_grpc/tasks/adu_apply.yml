---
# Hot-add vless-grpc users to the running container via `xray api adu` (no restart).

- name: Assert vless-grpc container is running
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - "-f"
      - "{{ '{{' }}.State.Running{{ '}}' }}"
      - "{{ vless_grpc_container_name }}"
  register: _vless_grpc_running
  changed_when: false
  failed_when: >-
    (_vless_grpc_running.rc | int != 0)
    or ((_vless_grpc_running.stdout | default('') | trim | lower) != 'true')

- name: Copy adu payload to wrapper host
  ansible.builtin.copy:
    src: "{{ awg_work_vless_grpc_configs }}/{{ inventory_hostname }}.adu.json"
    dest: "{{ vless_grpc_dir }}/.adu_clients.json"
    mode: "0600"

- name: Apply new vless-grpc users via adu until visible in running container
  ansible.builtin.shell: |
    set -euo pipefail
    docker cp "{{ vless_grpc_dir }}/.adu_clients.json" \
      "{{ vless_grpc_container_name }}:/tmp/.xray_adu_clients.json"
    docker exec "{{ vless_grpc_container_name }}" \
      xray api adu -s 127.0.0.1:{{ vless_grpc_api_port }} /tmp/.xray_adu_clients.json || true
    sleep 1
    listing="$(docker exec "{{ vless_grpc_container_name }}" \
      xray api inbounduser -s 127.0.0.1:{{ vless_grpc_api_port }} -tag={{ vless_grpc_inbound_tag }} 2>&1)"
    missing=0
    for uuid in {{ vless_peer_batch | map(attribute='uuid') | join(' ') }}; do
      echo "$listing" | grep -qF "$uuid" || missing=$((missing + 1))
    done
    test "$missing" -eq 0
  args:
    executable: /bin/bash
  register: _vless_grpc_adu_apply
  until: _vless_grpc_adu_apply.rc | int == 0
  retries: 5
  delay: 2
  changed_when: true

- name: Remove adu payload file from wrapper host
  ansible.builtin.file:
    path: "{{ vless_grpc_dir }}/.adu_clients.json"
    state: absent
