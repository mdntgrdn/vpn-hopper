---
# vless-grpc wrapper (Xray) deployed on the chain entry host.
awg_components_root: "{{ awg_ansible_root }}/components"
awg_roles_vless_grpc_tasks: "{{ awg_roles_root }}/vless_grpc/tasks"

vless_grpc_components_root: "{{ awg_components_root }}/vless-grpc"
vless_grpc_dockerfile_src: "{{ vless_grpc_components_root }}/docker/Dockerfile"

vless_grpc_dir: "{{ deploy_dir }}/vless-grpc"
vless_grpc_config_path: "{{ vless_grpc_dir }}/config.json"
vless_grpc_config_mount_dest: /usr/local/etc/xray/config.json
vless_grpc_letsencrypt_dir: "{{ vless_grpc_dir }}/letsencrypt"
vless_grpc_vless_clients: "{{ vless_grpc_dir }}/vless_clients.yml"

vless_grpc_docker_image_name: "{{ awg_chain_name }}-vless-grpc"
vless_grpc_container_name: "{{ awg_chain_name }}-vless-grpc"
vless_grpc_api_port: 10086
vless_grpc_inbound_tag: "vless-grpc-in"

# Wrapper parameters come from chain_generated.yml (chain_wrapper_*).
vless_grpc_server_name: "{{ chain_wrapper_server_name }}"
vless_grpc_listen_port: "{{ chain_wrapper_listen_port | default(443) }}"
vless_grpc_use_certbot: "{{ chain_wrapper_use_certbot | default(true) | bool }}"
vless_grpc_cert_file: >-
  {{ chain_wrapper_cert_file
     if (chain_wrapper_cert_file | default('') | trim) != ''
     else (vless_grpc_letsencrypt_dir ~ '/live/' ~ vless_grpc_server_name ~ '/fullchain.pem') }}
vless_grpc_key_file: >-
  {{ chain_wrapper_key_file
     if (chain_wrapper_key_file | default('') | trim) != ''
     else (vless_grpc_letsencrypt_dir ~ '/live/' ~ vless_grpc_server_name ~ '/privkey.pem') }}

# Controller-side rendered config + adu payloads.
awg_work_vless_grpc_configs: "{{ awg_work_root }}/vless_grpc_configs"
